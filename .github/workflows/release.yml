# Bouwt bij elke tag v* een zip van de extensie en publiceert die als GitHub Release.
# De extensie controleert /releases/latest; de zip in die release is de downloadlink.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie in manifest.json moet gelijk zijn aan de tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG komt niet overeen met manifest.json ($MANIFEST)"
            exit 1
          fi

      # Geen release als de linter of een test faalt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: Zip bouwen
        run: |
          mkdir -p dist/magister-docent-tools
          rsync -a ./ dist/magister-docent-tools/ \
            --exclude .git --exclude .github --exclude scripts --exclude dist \
            --exclude .gitignore --exclude '.DS_Store' \
            --exclude node_modules --exclude tests --exclude package.json \
            --exclude package-lock.json --exclude eslint.config.js
          cd dist
          zip -qr "magister-docent-tools-${GITHUB_REF_NAME}.zip" magister-docent-tools
          # Controlegetal: de updater in de extensie vergelijkt de gedownloade zip hiermee.
          sha256sum "magister-docent-tools-${GITHUB_REF_NAME}.zip" > "magister-docent-tools-${GITHUB_REF_NAME}.zip.sha256"
          ls -l

      - name: Release-notities uit README halen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          LINE="$(grep -m1 -E "^- ${TAG//./\\.}:" README.md | sed -E 's/^- [^:]+: *//' || true)"
          {
            echo "${LINE:-Versie $TAG.}"
            echo
            echo "**Installeren of bijwerken:** download \`magister-docent-tools-${GITHUB_REF_NAME}.zip\`, pak uit, vervang de bestanden in je extensiemap en klik in de extensie op Herladen (of op ↻ bij \`chrome://extensions\`)."
          } > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Versie ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/magister-docent-tools-*.zip
            dist/magister-docent-tools-*.zip.sha256
          generate_release_notes: true
