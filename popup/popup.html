<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<style>
  :root { --bg:#F2F2F7; --card:#fff; --fg:#1D1D1F; --muted:#6E6E73; --sep:rgba(60,60,67,.12); --accent:#007AFF; --tile:#fff; --tile-on:#E5F0FF; --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1C1C1E; --fg:#F2F2F7; --muted:#8E8E93; --sep:rgba(255,255,255,.12); --accent:#0A84FF; --tile:#1C1C1E; --tile-on:#0E2A4D; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); } }
  * { box-sizing:border-box; }
  body { width:344px; margin:0; padding:12px; font:13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased; }
  .head { display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px 10px; }
  .head h1 { font-size:17px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .head .ver { font-size:11px; color:var(--muted); }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px; margin-bottom:10px; }
  .card h2 { margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .theme { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  select { width:100%; font:inherit; font-size:13px; padding:7px 28px 7px 10px; border:0; border-radius:10px; background:var(--bg); color:var(--fg); appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; }
  .seg { display:inline-flex; padding:2px; border-radius:9px; background:var(--bg); }
  .seg button { font:inherit; font-size:12px; font-weight:500; padding:5px 10px; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--fg); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.14); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile { display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:center; padding:9px 10px; border:0; border-radius:14px; background:var(--bg); color:var(--fg); text-align:left; cursor:pointer; font:inherit; transition:background .12s, transform .08s; min-height:52px; }
  .tile:active { transform:scale(.98); }
  .tile .ico { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--k) 16%, var(--card)); color:var(--k); }
  .tile.on { background:color-mix(in srgb, var(--k) 12%, var(--card)); }
  .tile.on .ico { background:var(--k); color:#fff; }
  .tile b { display:block; font-size:12px; font-weight:600; line-height:1.2; }
  .tile small { display:block; font-size:10.5px; color:var(--muted); line-height:1.2; margin-top:1px; }
  .tile:not(.on) b { color:var(--muted); }
  .actions { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .actions button { font:inherit; font-size:11px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 4px 8px; border:0; border-radius:14px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .actions button:hover { background:var(--tile-on); }
  .actions .ico { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--card); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .actions kbd { font:10px ui-monospace, monospace; color:var(--muted); }
  .note { padding:4px 6px 2px; font-size:12px; color:var(--muted); }
  .note:empty { display:none; }
  .update { border-radius:16px; padding:12px; margin-bottom:10px; background:color-mix(in srgb, #FF9500 14%, var(--card)); box-shadow:var(--shadow); }
  .update strong { display:block; margin-bottom:2px; font-size:13px; }
  .update p { margin:2px 0 8px; font-size:12px; color:var(--muted); }
  .update .row { display:flex; gap:6px; }
  .update .row button { flex:1; font:inherit; font-size:12px; font-weight:600; padding:7px 8px; border:0; border-radius:10px; background:var(--card); color:var(--fg); cursor:pointer; }
  .update .primary { background:var(--accent) !important; color:#fff !important; }
  .update .small { margin:8px 0 0; font-size:11px; }
  .update .small a { color:inherit; }
  .foot { display:flex; justify-content:space-between; padding:2px 6px 0; font-size:11px; color:var(--muted); }
  .foot a { color:inherit; }
  .dev-only[hidden] { display:none; }
</style></head>
<body>
<div class="head"><h1>Docent Tools</h1><span class="ver" id="ver"></span></div>
<div class="update" id="update" hidden>
  <strong id="updTitle">Nieuwe versie beschikbaar</strong>
  <p id="updText"></p>
  <div class="row"><button class="primary" id="updNow">Nu bijwerken</button><button id="updNotes">Wat is nieuw</button></div>
  <p class="small">Handmatig: <a href="#" id="updDownload">zip downloaden</a> · <a href="#" id="updReload">herladen</a> na het vervangen van de bestanden.</p>
</div>
<div class="card">
  <h2>Thema</h2>
  <div class="theme"><select id="preset" aria-label="Thema"></select><div class="seg" id="modeSeg"><button data-mode="light">Licht</button><button data-mode="dark">Donker</button></div></div>
</div>
<div class="card">
  <h2>Modules</h2>
  <div class="tiles" id="tiles"></div>
</div>
<div class="card">
  <h2>Acties</h2>
  <div class="actions" id="actions"></div>
</div>
<div class="note" id="note"></div>
<div class="foot"><a href="#" id="options">Alle instellingen</a><a href="#" id="updCheck">Controleer op updates</a></div>
<script src="../content/defaults.js"></script>
<script src="popup.js"></script>
</body></html>
