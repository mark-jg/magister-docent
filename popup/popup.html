<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<style>
  body { width: 260px; margin:0; font:14px/1.4 "Segoe UI", system-ui, sans-serif; color:#1a1d21; background:#fff; }
  @media (prefers-color-scheme: dark) { body { color:#e8eaee; background:#161a20; } button { background:#161a20; color:#e8eaee; border-color:#2b313b; } .update { background:#2a2410; border-color:#5a4a1a; } .foot { color:#9aa3b2; } }
  h1 { font-size:14px; margin:0; padding:12px 14px; border-bottom:3px solid #E8B84A; }
  .list { padding:8px; display:flex; flex-direction:column; gap:6px; }
  button { font:inherit; text-align:left; padding:8px 10px; border:1px solid #e2e5ea; border-radius:7px; background:#fff; cursor:pointer; display:flex; justify-content:space-between; }
  button:hover { border-color:#1B3A5C; }
  kbd { font:11px ui-monospace, monospace; color:#6b7280; }
  .note { padding:4px 14px 8px; font-size:12px; color:#6b7280; }
  .note:empty { display:none; }
  .update { margin:0 8px 8px; padding:10px; border:1px solid #E8B84A; border-radius:8px; background:#fff8e6; font-size:13px; }
  .update strong { display:block; margin-bottom:4px; }
  .update p { margin:4px 0 8px; font-size:12px; color:#6b7280; }
  .update .row { display:flex; gap:6px; }
  .update .row button { flex:1; justify-content:center; font-size:13px; padding:6px 8px; }
  .update .primary { background:#1B3A5C; color:#fff; border-color:#1B3A5C; }
  .update .small { margin:8px 0 0; font-size:11px; }
  .update .small a { color:inherit; }
  .foot { display:flex; justify-content:space-between; padding:6px 14px 10px; font-size:11px; color:#6b7280; border-top:1px solid #e2e5ea33; }
  .foot a { color:inherit; }
</style></head>
<body>
<h1>Docent Tools voor Magister</h1>
<div class="update" id="update" hidden>
  <strong id="updTitle">Nieuwe versie beschikbaar</strong>
  <p id="updText"></p>
  <div class="row">
    <button class="primary" id="updNow">Nu bijwerken</button>
    <button id="updNotes">Wat is nieuw</button>
  </div>
  <p class="small">Handmatig: <a href="#" id="updDownload">zip downloaden</a> · <a href="#" id="updReload">herladen</a> na het vervangen van de bestanden.</p>
</div>
<div class="list">
  <button data-cmd="toggle-panel">Paneel openen <kbd>Alt+D</kbd></button>
  <button data-cmd="toggle-theme">Thema wisselen <kbd>Alt+T</kbd></button>
  <button data-cmd="export">Tabellen naar Excel <kbd>Alt+E</kbd></button>
  <button data-cmd="mail-coach">Mail begeleidingscoach <kbd>Alt+M</kbd></button>
  <button data-cmd="inspector">Inspector <kbd>Alt+I</kbd></button>
  <button id="options">Instellingen</button>
</div>
<div class="note" id="note"></div>
<div class="foot"><span id="ver"></span><a href="#" id="updCheck">Controleer op updates</a></div>
<script src="popup.js"></script>
</body></html>
