<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docent Tools</title>
<link rel="stylesheet" href="../content/base.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="kolom-kop">
  <div class="kolom-titel"><h1>Docent Tools</h1><span id="versie"></span><span id="kolomDatum"></span></div>
  <nav class="kolom-tabs" role="tablist" aria-label="Onderdelen">
    <button role="tab" id="tab-start" aria-controls="blad" aria-selected="true" data-blad="start" title="Acties, tabellen, notities en links">Start</button>
    <button role="tab" id="tab-uiterlijk" aria-controls="blad" aria-selected="false" data-blad="uiterlijk" tabindex="-1" title="Thema, kleur, lettertype">Uiterlijk</button>
    <button role="tab" id="tab-modules" aria-controls="blad" aria-selected="false" data-blad="modules" tabindex="-1" title="Onderdelen aan- en uitzetten en instellen">Modules</button>
    <button role="tab" id="tab-meer" aria-controls="blad" aria-selected="false" data-blad="meer" tabindex="-1" title="Periodes, zijkolom, ontwikkelaar">Meer</button>
  </nav>
</header>

<main id="blad" role="tabpanel" aria-labelledby="tab-start">
  <div id="meldingen">
    <div class="kolom-melding" id="geenMagister" hidden>
      <div><strong>Geen Magister-tabblad in beeld</strong><span>Tabellen en acties gelden voor het Magister-tabblad dat je voor je hebt.</span></div>
    </div>
    <div class="kolom-melding" id="herladen" hidden>
      <div><strong>Herlaad het Magister-tabblad</strong><span>De extensie is bijgewerkt of net geladen; dit tabblad draait nog de vorige versie.</span></div>
      <button class="dt-btn dt-btn-sm" id="herlaadKnop">Herladen</button>
    </div>
    <div class="kolom-melding is-ok" id="bijgewerkt" hidden><div><strong id="bijgewerktTekst"></strong></div></div>
  </div>
  <!-- Eigen inhoud van de kolom, in drie delen (paneel.js); per tabblad is er één zichtbaar. -->
  <div id="dt-panel"></div>
  <!-- Daaronder, op Uiterlijk, Modules en Meer: de bijbehorende groep van de instellingenpagina. -->
  <iframe id="instellingen" title="Instellingen" hidden></iframe>
  <div class="kolom-voet"><span id="versieVoet"></span></div>
</main>

<script src="../content/defaults.js"></script>
<script src="../content/core.js"></script>
<script src="../content/modules/theme-kleur.js"></script>
<script src="../content/modules/theme-themas.js"></script>
<script src="sidepanel.js"></script>
<script src="paneel.js"></script>
<script src="start.js"></script>
</body>
</html>
